name: Build Extensions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/vscode-extension/**"
      - "packages/jetbrains-extension/**"
      - "packages/ide-panel/**"
      - "packages/language-definitions/**"
      - "packages/core/**"

jobs:
  build-vscode:
    name: Build VSCode Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Language Definitions
        run: npm run build -w @morphql/language-definitions

      - name: Build Core Package
        run: npm run build -w @morphql/core

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Package VSCode Extension
        run: |
          cd packages/vscode-extension
          vsce package --no-dependencies

      - name: Upload VSCode Extension Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: packages/vscode-extension/*.vsix
          retention-days: 90

  build-jetbrains:
    name: Build JetBrains Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Language Definitions
        run: npm run build -w @morphql/language-definitions

      - name: Build Core Package
        run: npm run build -w @morphql/core

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JetBrains Plugin
        run: |
          cd packages/jetbrains-extension
          ./gradlew buildPlugin

      - name: Upload JetBrains Extension Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-extension
          path: packages/jetbrains-extension/build/distributions/*.zip
          retention-days: 90

  create-release:
    name: Create Draft Release
    needs: [build-vscode, build-jetbrains]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSCode Extension
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: ./artifacts

      - name: Download JetBrains Extension
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-extension
          path: ./artifacts

      - name: Build Release Body
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v h="## [$VERSION]" 'index($0, "## [") == 1 { f = index($0, h) == 1; next } f' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::No CHANGELOG.md entry for $VERSION"
            NOTES="<!-- Add your release notes here -->"
          fi
          cat > release-body.md <<EOF
          ## 📝 Release Notes
          $NOTES

          ---

          ## 📦 Extension Downloads

          Download the extensions below for manual installation:

          - **VSCode**: Install the \`.vsix\` file via "Extensions: Install from VSIX..." command
          - **JetBrains**: Install the \`.zip\` file via Settings → Plugins → ⚙️ → Install Plugin from Disk
          EOF

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./artifacts/*.vsix
            ./artifacts/*.zip
          body_path: release-body.md
